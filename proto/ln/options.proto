syntax = "proto3";

package ln;

import "google/protobuf/descriptor.proto";

option csharp_namespace = "LuckyNumbers.Model.Options";

// Tells the code generator what to emit for a message.
// Field numbers 50000-99999 are reserved for in-house options.
extend google.protobuf.MessageOptions {
  // Published/subscribed through MessagePipe: struct + RegisterMessageBroker<T>.
  bool event = 50001;
  // Runtime state, exposed reactively (R3) to systems and UI.
  bool state = 50002;
  // Authored data, loaded from a content/*.txtpb file.
  bool config = 50003;
  // Small immutable value type (C# readonly struct), e.g. vectors.
  bool value = 50004;
  // Fields map 1:1 to this shader's properties (planet_color -> _PlanetColor);
  // generates ApplyTo(Material). Content must set every field.
  string material = 50005;
  // On an (ln.state) or (ln.event): mirrored to the web page (tools/protogen.py -> WebMirror.g.cs + web/src/generated).
  // States go out as one snapshot per changed state per frame; events go out as they happen.
  bool web = 50006;
  // On an (ln.event): the page may also publish it into the game (implies web; fields must be scalars/enums).
  bool web_in = 50007;
}

extend google.protobuf.FieldOptions {
  // On a string field: a content path (e.g. "space/looks/planets/ice", relative to content/, no extension)
  // whose message is merged into the named sibling field before that field's inline values.
  // On a repeated string field: each path is appended to the named repeated field.
  string ref = 50101;
}
