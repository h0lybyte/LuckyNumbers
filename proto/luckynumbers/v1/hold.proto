syntax = "proto3";

package luckynumbers.v1;

import "ln/options.proto";
import "luckynumbers/v1/hold_hall.proto";
import "luckynumbers/v1/hold_life.proto";

option csharp_namespace = "LuckyNumbers.Model";

// Dwarven holds: structures built on and under dwarven worlds from a cell grid (2 m cells, 3 m storeys), meshed
// into chunks and skinned from one texture array. Bounded areas (gate, great hall, later cities) and the endless
// deep (mines, region by region) produce the same grid, so they share the mesher, textures and lighting.
message HoldConfig {
  option (ln.config) = true;
  // Cell footprint and storey height (metres).
  float cell_size = 1;
  float storey_height = 2;
  // Cells per side of a mesh chunk: one mesh (one draw call) per chunk.
  int32 chunk_cells = 3;
  // The texture array's layers and the palettes that pick from it.
  HoldTextures textures = 4;
  string textures_ref = 5 [(ln.ref) = "textures"];
  // The endless deep: cells per region side, and storeys (levels) per region.
  int32 region_cells = 6;
  int32 region_levels = 7;
  // How the mines are dug, region by region.
  MineRules mines = 8;
  string mines_ref = 9 [(ln.ref) = "mines"];
  // Lantern light baked into vertex colours: reach (metres), colour, and the ambient floor everything keeps.
  float lantern_radius = 10;
  float lantern_r = 11;
  float lantern_g = 12;
  float lantern_b = 13;
  float ambient = 14;
  // The bounded hold at the top of the deep: gate, great hall, rooms, the way down (hold_hall.proto).
  HallRules hall = 15;
  string hall_ref = 16 [(ln.ref) = "hall"];
  // What lives and lies in the deep: creatures, relic caches (hold_life.proto).
  HoldLife life = 17;
  string life_ref = 18 [(ln.ref) = "life"];
  // Climbing shafts (metres per second).
  float climb_speed = 19;
}

// Travel between a dwarven planet's surface and its hold (Planet <-> Hold scenes).
message HoldTrip {
  option (ln.state) = true;
  // Came in through the surface gate: spawn inside the hall's gate. False: straight in (dev), into the mines.
  bool from_surface = 1;
  // Walked out through the gate: the planet puts you outside it.
  bool leaving = 2;
}

// One Texture2DArray built from tile textures (Art/Textures/...): every layer the same size, in this order.
message HoldTextures {
  // Folder under Assets/_Project/Art/Textures holding the sources (e.g. "Delven").
  string source = 1;
  // Layer size in pixels; smaller sources are scaled up with point sampling (crisp texels).
  int32 size = 2;
  // Texture names without extension, relative to the source folder (e.g. "Surfaces/dlv_stonebrk1a").
  // A layer's index in this list is its slice in the array.
  repeated string layers = 3;
  // Named sets of layers, one per kind of space (hall, forge, mine...). Cells pick one by index.
  repeated HoldPalette palettes = 4;
}

// Which layer each surface of a cell uses (names from HoldTextures.layers).
message HoldPalette {
  string name = 1;
  string floor = 2;
  string wall = 3;
  string ceiling = 4;
  // Door frames, wall bases, pillar caps.
  string trim = 5;
  // Pillars and support beams.
  string pillar = 6;
}

// Mines: each region is dug from hash(seed, region) alone. Openings on a shared region edge come from a hash of
// that edge, so neighbours always agree and the deep goes on without a global plan.
message MineRules {
  // Openings per region side (each a tunnel mouth on the edge, inclusive range).
  int32 openings_min = 1;
  int32 openings_max = 2;
  // Chance a region has a shaft down to the region below (and so the one above has the matching shaft up).
  float shaft_chance = 3;
  // Tunnels wander: chance per cell to turn.
  float turn_chance = 4;
  // Chambers dug along the tunnels: count range and side length range (cells).
  int32 chambers_min = 5;
  int32 chambers_max = 6;
  int32 chamber_size_min = 7;
  int32 chamber_size_max = 8;
  // Lanterns: about one per this many walkable cells.
  int32 cells_per_lantern = 9;
  // Palette name for mine cells (HoldTextures.palettes).
  string palette = 10;
}
