syntax = "proto3";

package luckynumbers.v1;

import "ln/options.proto";
import "luckynumbers/v1/cargo.proto";
import "luckynumbers/v1/character.proto";
import "luckynumbers/v1/common.proto";

option csharp_namespace = "LuckyNumbers.Model";

// The player's pack (content/items.txtpb): a grid (10 x 6) that items fit into by shape, like falling blocks;
// drag to move, R to rotate. Weight is separate: each item has bulk, and over a limit set by Strength you're
// encumbered (slower), then overloaded (much slower). Your class packs a starting kit; relics you pick up go in too.
message ItemConfig {
  option (ln.config) = true;
  int32 grid_width = 1;
  int32 grid_height = 2;
  repeated ItemDef items = 3;
  repeated StartingKit kits = 4;
  // Bulk you carry freely is Strength x bulk_per_str; past Strength x overload_per_str you're overloaded.
  float bulk_per_str = 5;
  float overload_per_str = 6;
  // Walking speed while encumbered / overloaded.
  float encumbered_speed = 7;
  float overloaded_speed = 8;
  // 9-10: relic_items / default_relic_item, gone: a relic is its own item now.
  reserved 9, 10;
  // Shown when something doesn't fit.
  string full_prompt = 11;
  // Items with files of their own (named relics: content/items/relics/<id>), appended to `items`.
  repeated string item_refs = 12 [(ln.ref) = "items"];
}

enum ItemKind {
  ITEM_KIND_NONE = 0;
  ITEM_KIND_GEAR = 1;
  ITEM_KIND_CONSUMABLE = 2;
  ITEM_KIND_RELIC = 3;
  ITEM_KIND_TOOL = 4;
  ITEM_KIND_WEAPON = 5;
  ITEM_KIND_ARMOR = 6;
}

// Where an item can be worn or held (the Equipment tab, next).
enum EquipSlot {
  EQUIP_SLOT_NONE = 0;
  EQUIP_SLOT_HEAD = 1;
  EQUIP_SLOT_BODY = 2;
  EQUIP_SLOT_HANDS = 3;
  EQUIP_SLOT_WEAPON = 4;
  EQUIP_SLOT_TOOL = 5;
}

message ItemDef {
  string id = 1;
  string name = 2;
  string description = 3;
  ItemKind kind = 4;
  EquipSlot slot = 5;
  // Its footprint in the grid: rows top to bottom separated by "/", "#" filled, "." empty ("##/#." is an L).
  // Empty: one cell.
  string shape = 6;
  float bulk = 7;
  int32 value = 8;
  Rgba color = 9;
  // Using it (consumables are used up): the same effects relic rolls have (heal, full heal, reveal...).
  repeated RelicEffect effects = 10;
  float amount = 11;
  float seconds = 12;
  bool consumable = 13;
  // While equipped (in its slot): bonuses to abilities, skills, Stamina, HP, relic rolls and the bulk you carry
  // freely. Nothing is drawn (you're first-person arms) except an equipped weapon with a model, in your hands.
  repeated AbilityBonus ability_bonuses = 14;
  repeated SkillBonus skill_bonuses = 15;
  int32 stamina_bonus = 16;
  int32 hp_bonus = 17;
  int32 relic_bonus = 18;
  float bulk_bonus = 19;
  // One per universe (relics): never a second copy, never stacked (docs/items.md).
  bool unique = 20;
  // More than 1: this many copies share one cell (med-patches, rations). Bulk and value count each copy.
  int32 stack = 21;
  // Its own model, built into the scene: a relic's file name in Art/Models/Relics, a weapon's in Art/Models/Weapons
  // (drawn into your hands while equipped; "PLACEHOLDER_<id>": named blocks until it has one). Empty: a placeholder
  // block on the ground (and an equipped weapon fires from the hip).
  string model = 22;
  // Whose it was, when, and a line about them (named relics: shown when you pick it up).
  ItemLore lore = 23;
  // Using it rolls a d20 on a table (relics), with a cooldown.
  ItemUse use = 24;
  // 25-27: hold / ranged / melee (docs/items.md step 5).
  // A second colour (the relic shader's _ColorB; `color` is _ColorA).
  Rgba color_b = 28;
}

message ItemLore {
  string figure = 1;
  string era = 2;
  string text = 3;
}

message ItemUse {
  // Seconds before it can be used again.
  float cooldown_seconds = 1;
  // What a d20 roll does (+ your luck die, up to cargo.txtpb luck_bonus, + the sheet's relic bonus): the first row
  // whose range holds the total. A natural 1 is always 1 (row 1), a natural 20 always 20.
  repeated RelicRoll rolls = 2;
}

message SkillBonus {
  // SkillDef.id.
  string skill = 1;
  int32 amount = 2;
}

message StartingKit {
  // CharacterClass.id.
  string class_id = 1;
  // Item ids; repeat one to carry several.
  repeated string items = 2;
}


// What's in the pack (Core/InventoryPresenter; the page's Inventory and Equipment tabs). Each item is only what
// varies per copy: "uid|kind|x|y|rot|equipped|count", kind = its index into `kinds` (what it is; the page turns the
// kind's shape `rot` quarter turns itself), equipped = the slot it's in now (0: in the grid; x, y unused then),
// count = copies in the stack.
message PlayerInventory {
  option (ln.state) = true;
  option (ln.web) = true;
  int32 width = 1;
  int32 height = 2;
  repeated string items = 3;
  float bulk = 4;
  float bulk_limit = 5;
  float bulk_max = 6;
  // 0 light, 1 encumbered, 2 overloaded; and the walking speed that gives.
  int32 load = 7;
  float speed = 8;
  int32 value = 9;
  // The last thing that didn't fit, or that happened ("No room for ...").
  string message = 10;
  // Everything equipped adds up to (for the Equipment tab): each "label|value", e.g. "Engineering|+2".
  repeated string gear_bonuses = 11;
  // There's a world to drop things into (the crash site): Drop and a full-pack unequip put the item at your feet.
  bool can_drop = 12;
  // The relic R uses (the one you picked up or used last; 0: none), its name, and seconds until it's ready.
  int32 ready = 13;
  string ready_name = 14;
  float cooldown = 15;
  // Every kind of item there is (items.txtpb, in order), sent once: "id|name|kind|shape|bulk|value|color|description|
  // actions|slot|bonuses": shape unturned (rows "/"), color "#rrggbb", actions bits 1 = use, 2 = drop, 4 = equip;
  // slot = its EquipSlot; bonuses as text ("Engineering +2, STR +1"); bulk and value are per copy.
  repeated string kinds = 16;
}

// The page: put item `uid` in its equipment slot (whatever was there goes back into the pack, if it fits).
message InventoryEquipRequested {
  option (ln.event) = true;
  option (ln.web_in) = true;
  int32 uid = 1;
}

// The page: take slot `slot` (EquipSlot) off, back into the pack where it fits. (Dragging an equipped item onto
// the grid is an InventoryMoveRequested.)
message InventoryUnequipRequested {
  option (ln.event) = true;
  option (ln.web_in) = true;
  int32 slot = 1;
}

// Equipment changed (CharacterPresenter re-adds the gear bonuses).
message EquipmentChanged {
  option (ln.event) = true;
}

// The page's grid: put item `uid` at cell (x, y) (its shape's top left), turned `rot` quarter turns clockwise.
message InventoryMoveRequested {
  option (ln.event) = true;
  option (ln.web_in) = true;
  int32 uid = 1;
  int32 x = 2;
  int32 y = 3;
  int32 rot = 4;
}

message InventoryUseRequested {
  option (ln.event) = true;
  option (ln.web_in) = true;
  int32 uid = 1;
}

message InventoryDropRequested {
  option (ln.event) = true;
  option (ln.web_in) = true;
  int32 uid = 1;
}

// An item was used for an effect only the scene can do (reveal relics, slow): RelicsPresenter applies it.
message ItemEffectRequested {
  option (ln.event) = true;
  RelicEffect effect = 1;
  float amount = 2;
  float seconds = 3;
}
