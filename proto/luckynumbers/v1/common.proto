syntax = "proto3";

package luckynumbers.v1;

import "ln/options.proto";

option csharp_namespace = "LuckyNumbers.Model";

message Vec2 {
  option (ln.value) = true;
  float x = 1;
  float y = 2;
}

message Vec3 {
  option (ln.value) = true;
  float x = 1;
  float y = 2;
  float z = 3;
}

// Linear 0..1 RGBA.
message Rgba {
  option (ln.value) = true;
  float r = 1;
  float g = 2;
  float b = 3;
  float a = 4;
}
