syntax = "proto3";

package luckynumbers.v1;

import "ln/options.proto";
import "luckynumbers/v1/common.proto";
import "luckynumbers/v1/station.proto";

option csharp_namespace = "LuckyNumbers.Model";

// Fighting on a planet (content/combat.txtpb). Every hit is a d20 roll: d20 + the attacker's bonus against the
// target's armour; a natural 20 always hits and doubles the damage dice, a natural 1 always misses. You attack with
// your equipped weapon (bolts from your hands), your ship's lasers or a melee weapon; your bonus is that weapon's
// ability modifier plus attack_per_level x your level. Monsters roll their own `attack` against your armour
// (player_armor + defense_ability's modifier). Damage takes Stamina first, then HP; at 0 HP you're rescued.
message CombatConfig {
  option (ln.config) = true;
  repeated MonsterType monsters = 1;
  // Monsters on a job's site: count + count_per_danger x danger (a Clear job: at least its goal), placed in a ring
  // round the wreck between spawn_min and spawn_max metres.
  int32 count = 2;
  int32 count_per_danger = 3;
  float spawn_min = 4;
  float spawn_max = 5;
  int32 player_armor = 6;
  string defense_ability = 7;
  float attack_per_level = 8;
  // What each attack does: an equipped item (by item id), "ship" (the fighter's lasers), "melee", and "default"
  // for an equipped weapon with no entry.
  repeated CombatWeapon weapons = 9;
  CombatRescue rescue = 10;
  // A Defend job's horde (JobKind.DEFEND).
  DefendConfig defend = 11;
}

// A Defend job (JobKind.DEFEND): a beacon stands by the wreck; plant it (E) and it charges, one wave at a time, while a
// horde comes for it. Each wave the beacon charges for charge_seconds while the wave's monsters arrive in a ring
// spawn_radius out round it (staggered, spawn_interval apart, never more than max_alive at once: the rest wait their
// turn); then rest_seconds' breather (the stragglers keep coming) and the next. Every wave fully charged: the job's
// done, the horde scatters, `xp`. The beacon at 0 hp: the job's failed and the horde scatters all the same. Horde
// monsters go for whichever is nearer, you or the beacon; they bite it (d20 + attack against beacon_armor) and an
// arcanist's flask splashes it. Metres, seconds.
message DefendConfig {
  // Waves when the job doesn't say (a dev defend): waves + waves_per_danger x danger.
  int32 waves = 1;
  float waves_per_danger = 2;
  int32 beacon_hp = 3;
  int32 beacon_hp_per_danger = 4;
  int32 beacon_armor = 5;
  float charge_seconds = 6;
  float rest_seconds = 7;
  // Monsters in wave 1: budget + budget_per_danger x danger; each wave after has budget_growth x the one before.
  int32 budget = 8;
  float budget_per_danger = 9;
  float budget_growth = 10;
  // Horde monsters alive at once (the low-end tier, Rendering/LowEnd: max_alive_low_end).
  int32 max_alive = 11;
  int32 max_alive_low_end = 12;
  float spawn_interval = 13;
  // How far out round the beacon they turn up (just past their sight), and give or take.
  float spawn_radius = 14;
  float spawn_jitter = 15;
  // Who comes, by weight (`weight` + weight_per_wave x the wave before this one).
  repeated DefendMix mix = 16;
  // On the win, on top of the job's pay.
  int32 xp = 17;
  // The beacon: how far out from the wreck's hull (on the landing pad's side), its pillar, and how close you stand to plant it.
  float beacon_offset = 18;
  Vec3 beacon_size = 19;
  float plant_distance = 20;
  string plant_prompt = 21;
  // Said as it goes ({wave}, {waves}: the wave and how many there are).
  string planted_text = 22;
  string wave_text = 23;
  string won_text = 24;
  string lost_text = 25;
}

// One kind of monster a Defend horde brings (MonsterType.id); rushers bite, a thrower (its type's `ranged`) hangs back.
message DefendMix {
  string monster = 1;
  float weight = 2;
  float weight_per_wave = 3;
  // Not before this wave (1 = from the start), nor on a job below danger_min.
  int32 wave_min = 4;
  int32 danger_min = 5;
}

// A Defend job's beacon and its horde (mirrored to the page). `phase`: "" none, "ready" (stands unplanted), "charging",
// "rest" (between waves), "won", "lost". `charge`: this wave's, 0..1 (in 1% steps); `rest`: seconds to the next wave;
// `horde`: horde monsters on the ground, `waiting` still to come this wave.
message DefendState {
  option (ln.state) = true;
  option (ln.web) = true;
  string phase = 1;
  int32 wave = 2;
  int32 waves = 3;
  float charge = 4;
  int32 rest = 5;
  int32 hp = 6;
  int32 hp_max = 7;
  int32 horde = 8;
  int32 waiting = 9;
}

// A monster: a placeholder block, or `model` (a rigged creature, Art/Characters/<model>) once it has one.
// `danger_min`: it only turns up on jobs at least that dangerous. Metres, m/s, seconds.
message MonsterType {
  string id = 1;
  string name = 2;
  int32 hp = 3;
  int32 armor = 4;
  int32 attack = 5;
  // Dice: "NdM+K" (e.g. "1d6+1").
  string damage = 6;
  float speed = 7;
  // Its block: width, height, depth.
  Vec3 size = 8;
  Rgba color = 9;
  // Bites from this close; notices you from `sight`; seconds between attacks.
  float reach = 10;
  float sight = 11;
  float cooldown = 12;
  int32 xp = 13;
  int32 danger_min = 14;
  // Relative chance among the monsters that can turn up.
  float weight = 15;
  // Its model (PlanetView's monster models, by name; empty = the placeholder block). `size` is then its hitbox.
  string model = 16;
  MonsterClips clips = 17;
  // A thrower (unset: it only bites): keeps its distance and lobs flasks at you.
  MonsterRanged ranged = 18;
}

// A monster's ranged attack: a flask lobbed on a ballistic arc that splashes where it lands. While chasing, it keeps
// between range_min and range_max (steps in past range_max, backs off inside range_min, else circles you) and casts
// when its cooldown's up and it can see you; in `reach` it still bites. The cast winds up for cast_time seconds (its
// cast clip), then releases toward where you are (and a little where you're going). On impact (the ground or you)
// you're hit if within splash_radius: d20 + attack (+ direct_bonus if it struck you) against your armour, `damage`
// as a bite's. It flies slowly: step aside. Metres, m/s, m/s^2, seconds.
message MonsterRanged {
  float range_min = 1;
  float range_max = 2;
  // Seconds between casts; the wind-up before release.
  float cooldown = 3;
  float cast_time = 4;
  // Launch speed and the fall's pull (lower: a floatier lob). Too far for this speed: thrown its farthest, short.
  float speed = 5;
  float gravity = 6;
  int32 attack = 7;
  // Dice: "NdM+K".
  string damage = 8;
  float splash_radius = 9;
  // Added to the roll when the flask strikes you square.
  int32 direct_bonus = 10;
  // How much of your motion it leads by (0: where you stand, 1: where you'd be when it lands).
  float lead = 11;
  // The flask's glow, its trail and the splash (HDR: blooms).
  Rgba color = 12;
}

// A modelled monster's animations, by clip name (the model's takes). Walks play at the rate the body moves (the
// bake records each clip's stride speed), so feet don't slide. Empty: that moment has no clip.
message MonsterClips {
  string idle = 1;
  // Ambling round home; chasing you.
  string walk = 2;
  string run = 3;
  string attack = 4;
  // Hit and still standing; killed (it holds the last frame, then sinks into the ground).
  string hit = 5;
  string die = 6;
  // A spell or throw from range, once (MonsterView.Cast); empty: it has none.
  string cast = 7;
}

message CombatWeapon {
  // Item id, "ship", "melee" or "default".
  string source = 1;
  string name = 2;
  // The ability whose modifier adds to the attack roll ("dex", "str").
  string ability = 3;
  string damage = 4;
  // Hand weapons: seconds between shots, and what they shoot.
  float cooldown = 5;
  Projectile bolt = 12;
  reserved 6, 7, 8, 9, 10; // speed, range, length, width, color: in bolt
  // Gun models (Art/Models/Weapons names, e.g. "rifle_block") that shoot as this when held (the station range, a gun
  // picked up): their seconds between shots, damage dice and ability come from here. Unlisted models: "default".
  repeated string models = 11;
}

// At 0 HP: a rescue drone takes you back to the station. You lose the relics you carried and pay `fee` credits
// (as much as you have); HP and Stamina are full again. The station plays `lines` instead of the museum's call.
message CombatRescue {
  int32 fee = 1;
  string downed_text = 2;
  repeated StationCallLine lines = 3;
}

// One attack roll, for the page's roll feed: who at whom, the d20, the bonus, the total against the armour, hit or
// not (crit on a natural 20, fumble on a 1), and the damage rolled (dice as text, e.g. "1d8+2").
message CombatRoll {
  option (ln.event) = true;
  option (ln.web) = true;
  string attacker = 1;
  string target = 2;
  int32 d20 = 3;
  int32 bonus = 4;
  int32 total = 5;
  int32 armor = 6;
  bool hit = 7;
  bool crit = 8;
  bool fumble = 9;
  int32 damage = 10;
  string dice = 11;
  // You rolled it (else a monster attacked you).
  bool player = 12;
  string weapon = 13;
  // Your shots (Planet/Marksman): how far over the armour decides the damage. Missed by 1-2: a graze (half the dice);
  // beat it by 5+: a strong hit (one more die); a natural 20 doubles the dice.
  bool graze = 14;
  bool strong = 15;
  // What made up the bonus, e.g. "DEX +1 · aim +2 · steady +1 · recoil -3".
  string mods = 16;
}

// The fight on this site (mirrored to the page): monsters still alive and killed, the one you hit last
// ("name|hp|max", or "" once it's dead), and you're down (being rescued).
message CombatState {
  option (ln.state) = true;
  option (ln.web) = true;
  int32 alive = 1;
  int32 killed = 2;
  string target = 3;
  bool downed = 4;
  int32 armor = 5;
}
