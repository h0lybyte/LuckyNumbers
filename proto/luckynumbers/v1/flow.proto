syntax = "proto3";

package luckynumbers.v1;

import "ln/options.proto";

option csharp_namespace = "LuckyNumbers.Model";

// Top-level game flow: Title -> Station (your station; the call) -> Intro (cutscene) -> Planet.
enum GameScene {
  GAME_SCENE_UNSPECIFIED = 0;
  GAME_SCENE_TITLE = 1;
  GAME_SCENE_INTRO = 2;
  GAME_SCENE_PLANET = 3;
  // The player's space station, where their ship is docked.
  GAME_SCENE_STATION = 4;
  // 5: the dev Range scene, gone: the shooting range is a room in the station (?ln-range goes there).
  reserved 5;
  // The Flight School: a training deck in space to test-fly your ship (the station's Docking Bay console).
  GAME_SCENE_FLIGHT_SCHOOL = 6;
  // Outside the station: launched from the Docking Bay, fly round it in your ship and dock again.
  GAME_SCENE_ORBIT = 7;
}

message FlowState {
  option (ln.state) = true;
  option (ln.web) = true;
  GameScene scene = 1;
}

message SceneChangeRequested {
  option (ln.event) = true;
  option (ln.web_in) = true;
  GameScene target = 1;
}

message SceneEntered {
  option (ln.event) = true;
  option (ln.web) = true;
  GameScene scene = 1;
}

// Background loading of the next scene (title doubles as preloader).
message LoadingState {
  option (ln.state) = true;
  option (ln.web) = true;
  float progress = 1;
  bool ready = 2;
}
