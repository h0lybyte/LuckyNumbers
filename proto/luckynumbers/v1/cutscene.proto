syntax = "proto3";

package luckynumbers.v1;

import "ln/options.proto";
import "luckynumbers/v1/flow.proto";
import "luckynumbers/v1/space.proto";

option csharp_namespace = "LuckyNumbers.Model";

// A cutscene is an ordered list of steps, played one after another.
message Cutscene {
  option (ln.config) = true;
  string id = 1;
  repeated CutsceneStep steps = 2;
  // The universe it plays in. Generated from the player's lucky number, so it is the title's world.
  SpaceBackdrop backdrop = 3;
  string backdrop_ref = 4 [(ln.ref) = "backdrop"];
  // Ship skin file name in Art/Models/Fighter/Skins (e.g. "idolknight"); empty = the lucky number picks one.
  string ship_skin = 5;
  // Ship length, in target-planet diameters.
  float ship_size = 6;
}

message CutsceneStep {
  oneof step {
    DiceRoll dice_roll = 1;
    ShipPulledIn ship_pulled_in = 2;
    CrashLanding crash_landing = 3;
    Dialogue dialogue = 4;
    GoTo go_to = 5;
  }
}

// Dice tumble, then land on `faces`; empty = the player's own roll (keeps their universe).
message DiceRoll {
  repeated int32 faces = 1;
  float duration_seconds = 2;
}

// The ship is dragged toward the planet: a spiral that tightens and speeds up (gravity), banking into it.
message ShipPulledIn {
  float duration_seconds = 1;
  // Start distance from the planet's centre, in planet diameters.
  float start_distance = 2;
  // Laps around the planet before impact.
  float turns = 3;
  // Bank angle reached at the end of the spiral.
  float bank_degrees = 4;
  // Share of the step (0..1, from the end) where the camera stops chasing and watches the ship fall in.
  float camera_release = 5;
}

message CrashLanding {
  float duration_seconds = 1;
  // 0..1 camera shake strength.
  float camera_shake = 2;
  // White flash on impact, then fade to black over the rest of the step.
  float flash_seconds = 3;
}

message Dialogue {
  string speaker = 1;
  string text = 2;
  float duration_seconds = 3;
  // Typewriter speed; 0 = show the whole line at once.
  float chars_per_second = 4;
}

message GoTo {
  GameScene scene = 1;
}

message CutsceneStepStarted {
  option (ln.event) = true;
  string cutscene_id = 1;
  int32 index = 2;
}

message CutsceneFinished {
  option (ln.event) = true;
  string cutscene_id = 1;
}
