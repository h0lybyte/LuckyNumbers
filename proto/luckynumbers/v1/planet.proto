syntax = "proto3";

package luckynumbers.v1;

import "ln/options.proto";
import "luckynumbers/v1/common.proto";
import "luckynumbers/v1/cutscene.proto";
import "luckynumbers/v1/hands.proto";
import "luckynumbers/v1/space.proto";

option csharp_namespace = "LuckyNumbers.Model";

// The crash site: a small patch of the planet you landed on, walked in first person.
message PlanetScene {
  option (ln.config) = true;
  // The universe (same generator as the title), so the ground, sky and sun match the planet you hit.
  SpaceBackdrop backdrop = 1;
  string backdrop_ref = 2 [(ln.ref) = "backdrop"];
  reserved 3, 6; // ground_size, ground_resolution: the ground is endless chunks now
  // Terrain shape moved to the universe's GroundProfile (SystemGenerator.ground), so each universe has its own land.
  reserved 4, 5, 7, 57, 58, 59;
  reserved "ground_height", "ground_noise_scale", "surface_noise_scale", "site_relief", "swell_height", "swell_scale";
  // Chunks around the player: size (metres), vertices per side, and how many chunks out in each direction.
  float chunk_size = 26;
  int32 chunk_resolution = 27;
  int32 view_chunks = 28;
  // Far ring out to the horizon: chunks far_chunk_scale x bigger, far_resolution vertices per side, far_view_chunks
  // out each way. No collision, sunk under the detailed chunks; the haze fades fully into the sky at its edge.
  int32 far_chunk_scale = 54;
  int32 far_resolution = 55;
  int32 far_view_chunks = 56;
  // Walking (metres, seconds).
  float walk_speed = 8;
  float sprint_speed = 9;
  float jump_speed = 10;
  float gravity = 11;
  float eye_height = 12;
  float look_degrees_per_pixel = 13;
  // Feel: head bob (metres, steps per second at walk speed), arm sway (degrees per look pixel).
  float bob_amount = 14;
  float bob_frequency = 15;
  float sway = 16;
  // Wake up lying on the ground, then stand.
  float wake_seconds = 17;
  // The wreck: distance from where you wake, and ship length (metres).
  float wreck_distance = 18;
  float wreck_length = 19;
  // Atmosphere haze over the horizon and with distance (0..1).
  float haze = 20;
  // Sun height in the sky (degrees above the horizon).
  float sun_elevation_degrees = 21;
  string hint = 22;
  // Arm life on top of the (very still) idle clip: breathing lift, walking swing, finger fidget (degrees).
  float arm_breath_degrees = 23;
  float arm_swing_degrees = 24;
  float finger_fidget_degrees = 25;
  // The arms rig's bone map (content/hands/*).
  HandRig hands = 29;
  string hands_ref = 30 [(ln.ref) = "hands"];
  // Debug: hands trace circles in front of you cycling every pose; the IK error is logged (checks the rig map + solver).
  bool debug_reach = 31;
  // Reach out and touch surfaces (e.g. the wreck) closer than this (metres from the shoulder).
  float touch_distance = 32;
  // Boulders scattered around the crash site (seeded): how many, how far out, size range (metres).
  int32 boulders = 33;
  float boulder_spread = 34;
  float boulder_size_min = 35;
  float boulder_size_max = 36;
  // Debug: after waking, stand at (x, z) facing `y` degrees (all 0 = off). For testing spots, e.g. touch.
  Vec3 debug_spawn = 37;
  // Arm clips (from the rig; "{side}" = L/R): standing, running, and the one-arm throw.
  string idle_clip = 38;
  string sprint_clip = 39;
  string throw_clip = 40;
  // Body feel: running pumps the arm swing (x walk), arms rise when airborne (degrees), shaky hands after
  // the crash (degrees, fading over tremor_seconds).
  float sprint_pump = 41;
  float air_raise_degrees = 42;
  float crash_tremor_degrees = 43;
  float tremor_seconds = 44;
  // Pebbles near the wreck you can pick up (Interact), drop (Interact) or throw (click): count, size (m),
  // how far you can grab from your eyes (m), how low you'll crouch for one (m), throw speed (m/s).
  int32 pebbles = 45;
  float pebble_size = 46;
  float grab_distance = 47;
  float crouch_depth = 48;
  float throw_speed = 49;
  // Lines you say as you come to, typed out over the wake-up (starting `wake_lines_delay` seconds in);
  // the controls hint waits until they're done.
  repeated Dialogue wake_lines = 50;
  float wake_lines_delay = 51;
  // The planet map (M): a hex globe of the planet you're on.
  PlanetMap map = 52;
  // Arrival in your own ship: you fly it in and land it near the wreck (fully piloted). Unset = the old
  // arrival (waking up beside the wreck).
  FlightLanding landing = 53;
  // On a touch screen (PointerLock.Touch), in place of the keyboard / mouse line above; empty: that one.
  string touch_hint = 60;
  // In universes with holds (Universe.holds): the surface gate into the hold, near where you land.
  SurfaceGate gate = 61;

  // On-foot movement feel (also the station and holds, which clone these settings).
  // Ground acceleration and braking, steering in the air (m/s^2; ground 0 = instant, the old feel), and seconds
  // to ease from walk to run speed.
  float ground_accel = 62;
  float ground_decel = 63;
  float air_accel = 64;
  float sprint_ramp_seconds = 65;
  // One scale on every camera motion below and the head bob (0 = a still camera, 1 = as tuned): for a future
  // comfort setting. The arms keep their own sway.
  float camera_motion = 66;
  // Head bob shape: 0 = smooth (sin^2), 1 = a sharp footfall at each step (|sin|, the old bob).
  float bob_shape = 67;
  // Camera roll (degrees): strafing at run speed, turning at 180 deg/s (clamped at twice that), and each step.
  float strafe_roll_degrees = 68;
  float turn_roll_degrees = 69;
  float step_roll_degrees = 70;
  // Head dip on a spring: metres per m/s of landing speed (above a light step), at most land_dip_max; a small
  // dip as you jump; the spring's frequency (Hz) and damping ratio (under 1 bounces back a little).
  float land_dip_per_speed = 71;
  float land_dip_max = 72;
  float jump_dip = 73;
  float dip_spring_hz = 74;
  float dip_damping = 75;
  // Breathing when standing (metres of head rise, breaths per second at rest; faster and deeper after a run).
  float breath_amount = 76;
  float breath_rate = 77;
  // Field of view widens this much (degrees) at full run.
  float sprint_fov_kick = 78;
}

// A hold's gate set into the ground (Planet/SurfaceGatePresenter): a stone facade with a dark doorway, two lanterns and
// a stepped approach on a flattened pad. Placed from the site seed, distance_min..max metres from the site's middle,
// on the side away from the wreck. Metres.
message SurfaceGate {
  float distance_min = 1;
  float distance_max = 2;
  // The facade: width, height, and how deep the stone block runs back into the ground.
  float width = 3;
  float height = 4;
  float depth = 5;
  // The doorway in it: width and height.
  float door_width = 6;
  float door_height = 7;
  // The approach: how many steps up to the door, each this tall and deep.
  int32 steps = 8;
  float step_rise = 9;
  float step_depth = 10;
  // The flattened pad around it (the ground eases back to its own shape over the same distance again).
  float pad_radius = 11;
  // Walk this close to the doorway for the prompt; walk this far into it and you're in.
  float prompt_distance = 12;
  float walk_in_depth = 13;
  string prompt = 14;
  // Lanterns either side of the door: light colour, intensity and range.
  float lantern_r = 15;
  float lantern_g = 16;
  float lantern_b = 17;
  float lantern_intensity = 18;
  float lantern_range = 19;
}

// Piloting your fighter down to the crash site. Metres, seconds, m/s, m/s^2, degrees.
message FlightLanding {
  float ship_length = 1;
  // Where you start: height above the ground, horizontal distance from the wreck, forward speed.
  float start_altitude = 2;
  float start_distance = 3;
  float start_speed = 4;
  // Flight model: gravity; main engine at full throttle (x boost with Shift); lift thrusters (Space, along the
  // ship's up); air drag per second; how fast the throttle moves (W/S, share per second).
  float gravity = 5;
  float thrust = 6;
  float boost = 7;
  float lift = 8;
  float drag = 9;
  float throttle_per_second = 10;
  // Handling: mouse pitch/yaw (degrees per pixel), roll (A/D, degrees per second), how quickly turning settles
  // (per second), and how fast the wings level themselves when you're not rolling (degrees per second).
  float turn_degrees_per_pixel = 11;
  float roll_degrees_per_second = 12;
  float turn_damping = 13;
  float roll_return_degrees_per_second = 14;
  // A landing counts if every limit holds at touchdown; otherwise you crash and try again.
  float max_touchdown_vertical = 15;
  float max_touchdown_horizontal = 16;
  float max_touchdown_tilt = 17;
  // Chase camera: behind and above the ship (ship lengths).
  float chase_distance = 18;
  float chase_height = 19;
  string hint = 20;
  string landed_text = 21;
  string crashed_text = 22;
  // Said once you've stepped out.
  repeated Dialogue landed_lines = 23;
  // Wings: lift along the ship's up per (forward speed)^2 (so it glides when fast and sinks when slow: land
  // on the lift thrusters), and grip (per second) turning your motion toward where the nose points.
  float wing_lift = 24;
  float grip = 25;
  // Flight assist (on unless disabled): easier to fly, same feel.
  FlightAssist assist = 26;
  // Hover-ship controls (when enabled, instead of the flight model above): the ship hovers, holds its height and
  // stops when you let go; you fly it about and set it down. Easiest to land.
  FlightHover hover = 27;
  // Boarding: on foot within board_distance (metres from the hull) of your landed ship, E boards it (board_prompt)
  // and you fly it anywhere, landing wherever you like. Above orbit_altitude (metres above the ground) E breaks
  // orbit, back to the station (leave_prompt); the climb fades out at ceiling (x orbit_altitude).
  float orbit_altitude = 28;
  string board_prompt = 29;
  float board_distance = 30;
  // Without the page's HUD: shown once you're aboard.
  string takeoff_hint = 31;
  string leave_prompt = 32;
  float ceiling = 33;
  // On a touch screen (PointerLock.Touch), in place of the keyboard / mouse line above; empty: that one.
  string touch_hint = 34;
  string touch_takeoff_hint = 35;
}

// Six-axis ship controls with flight assist: the mouse aims the nose (yaw, pitch), Q/E roll; W/S thrust
// forward/back, A/D strafe, Space/C thrust up/down, all relative to the ship; Shift boosts; X brakes along
// your travel. Aim and travel are independent: the assist eases your velocity towards what the keys ask for
// (in the ship's frame, so swinging the nose leaves you sliding a moment), easing out of any motion you let go
// of, and cancels gravity so a released ship holds where it is. Near the ground a descent eases to
// `touchdown_speed`, and when you're low and not steering the ship levels itself, so landing stays forgiving.
message FlightHover {
  bool enabled = 1;
  float max_speed = 2;
  float reverse_speed = 3;
  float strafe_speed = 4;
  float boost = 5;
  // m/s^2 speeding up, and braking (also when you let go).
  float accel = 6;
  float brake = 7;
  float climb_speed = 8;
  float descend_speed = 9;
  float vertical_accel = 10;
  // Heading change at most (degrees per second) and how quickly it settles (per second).
  float turn_rate = 11;
  float turn_smoothing = 12;
  // Descents ease off below flare_height (m) to touchdown_speed (m/s); `clearance`: the height it keeps.
  float flare_height = 13;
  float touchdown_speed = 14;
  float clearance = 15;
  // Unused (the ship's own attitude shows its motion now).
  float lean_degrees = 16;
  // Roll (Q/E, degrees per second); X's brake (m/s^2); below level_height (m), with no steering input, the ship
  // levels itself at level_rate (degrees per second).
  float roll_rate = 17;
  float hard_brake = 18;
  float level_height = 19;
  float level_rate = 20;
  // Barrel roll (Shift+Q / Shift+E; Planet/BarrelRoll): a full 360 degree roll that way in barrel_roll_seconds,
  // carrying the ship barrel_roll_distance (m) sideways the same way (level with the ground, eased in and out, not
  // fought by the assist), leaving it drifting on at barrel_roll_dodge (m/s); then barrel_roll_cooldown seconds before
  // the next, barrel_roll_fuel units each (on the planet).
  float barrel_roll_seconds = 21;
  float barrel_roll_dodge = 22;
  float barrel_roll_cooldown = 23;
  float barrel_roll_fuel = 24;
  float barrel_roll_distance = 25;
}

// Flying in, for the page's flight HUD (the steps, the pad arrow, instruments, landing gauges): in the air /
// crashed / landed; altitude, climb, speed and the set speed (m, m/s); hovering, boost; the pad's distance and
// bearing from your nose (degrees, + right); descent, drift and tilt against the touchdown limits; why you
// crashed ("descent", "drift", "tilt", "hit", comma-separated); the assist on or not.
message FlightState {
  option (ln.state) = true;
  option (ln.web) = true;
  bool flying = 1;
  bool crashed = 2;
  bool landed = 3;
  float altitude = 4;
  float climb = 5;
  float speed = 6;
  float set_speed = 7;
  bool hovering = 8;
  bool boost = 9;
  float pad_distance = 10;
  float pad_bearing = 11;
  float descent = 12;
  float drift = 13;
  float tilt = 14;
  float max_descent = 15;
  float max_drift = 16;
  float max_tilt = 17;
  string crash_reason = 18;
  bool assisted = 19;
  // Hover-ship controls (the HUD's steps and keys follow them).
  bool hover_ship = 20;
  // Flying about (boarded after landing): land anywhere, or above orbit_altitude E goes back to the station
  // (`can_leave`).
  bool roaming = 21;
  float orbit_altitude = 22;
  bool can_leave = 23;
  // Fuel (units) and the tank; low (warn) and dry (engines out, the reserve cells letting you down).
  float fuel = 24;
  float fuel_max = 25;
  bool fuel_low = 26;
  bool fuel_empty = 27;
  // Guns: shots fired this flight (the HUD flashes its crosshair on a change).
  int32 shots = 28;
}

// The page draws the flight HUD: Unity's own text readout and controls line step aside.
message FlightHudReady {
  option (ln.event) = true;
  option (ln.web_in) = true;
  bool on = 1;
}

// Flight assist: the throttle sets a speed and the ship holds it (engine forward, air brakes back), and Space
// is a hover: the lift thrusters hold a controlled descent (faster up high, gentle near the ground), bleed off
// drift and level the ship, so touching down inside the limits is a matter of holding Space over the spot.
message FlightAssist {
  bool disabled = 1;
  // Throttle 0..1 maps to 0..max_speed (m/s; Shift boost: x boost_speed). How hard the engine and the air
  // brakes push towards it (m/s^2 at most; per m/s of difference).
  float max_speed = 2;
  float boost_speed = 3;
  float brake = 4;
  float speed_gain = 5;
  // Hover (Space): descent speed (m/s) at the ground and at most (up high: altitude x descent_per_metre),
  // how fast it reaches it (per second), drift bleed (per second) and levelling (degrees per second).
  float hover_descent = 6;
  float max_descent = 7;
  float descent_per_metre = 8;
  float hover_gain = 9;
  float hover_drift_damping = 10;
  float hover_level_degrees_per_second = 11;
  // Below this altitude (m) the wings level themselves this many times faster when you let go of roll.
  float low_altitude = 12;
  float low_level_factor = 13;
  // Steering: the mouse turns your heading (around the world's up) and pitch, capped (degrees per second, and
  // pitch at most max_pitch either way), and the ship banks into turns (degrees of roll per degree/second of
  // turn, at most max_bank); A/D add roll on top.
  float max_turn_rate = 14;
  float max_pitch = 15;
  float bank_per_turn = 16;
  float max_bank = 17;
  // A landing pad on the flattest spot this far from the wreck (metres), marked on the ground and the HUD.
  float pad_min_distance = 18;
  float pad_max_distance = 19;
  // Chase camera: extra field of view at full speed (degrees), and how much it tilts with the bank (0..1).
  float speed_fov = 20;
  float camera_bank = 21;
  // Hover cushion: the last few metres the descent eases off further (metres it starts at).
  float cushion_height = 22;
}

// A Goldberg globe: hexagons plus exactly 12 pentagons (Euler), 10 * frequency^2 + 2 cells, each coloured by
// the planet's own terrain noise (smooth: no relief), set in your real universe (its sky, star and moons).
message PlanetMap {
  reserved 3; // relief: the map stays smooth
  int32 frequency = 1;
  // Grout between cells (share of a cell), terrain noise scale and octaves.
  float gap = 2;
  float noise_scale = 4;
  int32 octaves = 5;
  // Cells below this terrain rank (0..1) are sea (0 = no sea).
  float sea_level = 6;
  // How far you walk (metres) to cross one radian of the globe: sets how far the pin moves as you walk.
  float walk_radius_metres = 7;
  Rgba crash_color = 8;
  Rgba pin_color = 9;
  Rgba grout = 10;
  // Camera distance in globe radii (overview, nearest, farthest), drag speed (degrees per pixel).
  float distance = 11;
  float zoom_min = 12;
  float zoom_max = 13;
  float drag_degrees_per_pixel = 14;
  string hint = 15;
  // Opening: from straight above your own tile (this distance, globe radii) out to `distance`, and back on close.
  float zoom_from = 16;
  float open_seconds = 17;
  float close_seconds = 18;
  // Your landed ship's marker (the crash marker only shows where there's a wreck).
  Rgba ship_color = 19;
  // On a touch screen (PointerLock.Touch), in place of the keyboard / mouse line above; empty: that one.
  string touch_hint = 20;
}

// The planet map (M): open from the moment it starts opening until it has fully closed.
// The pointer is free (not locked) while it's open, for dragging the globe.
message MapState {
  option (ln.state) = true;
  option (ln.web) = true;
  bool open = 1;
}

// Where the intro's ship came down: read by the Planet scene (and later a save file).
message LandingSite {
  option (ln.state) = true;
  option (ln.web) = true;
  bool valid = 1;
  // Body id of the planet (e.g. "home") in the universe of the current lucky number.
  string body = 2;
  reserved 3; // ship_skin: the wreck uses the player's ship (PlayerShip)
}
