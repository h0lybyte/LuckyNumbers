syntax = "proto3";

package luckynumbers.v1;

import "ln/options.proto";
import "luckynumbers/v1/common.proto";
import "luckynumbers/v1/hands.proto";
import "luckynumbers/v1/space.proto";

option csharp_namespace = "LuckyNumbers.Model";

// The crash site: a small patch of the planet you landed on, walked in first person.
message PlanetScene {
  option (ln.config) = true;
  // The universe (same generator as the title), so the ground, sky and sun match the planet you hit.
  SpaceBackdrop backdrop = 1;
  string backdrop_ref = 2 [(ln.ref) = "backdrop"];
  reserved 3, 6; // ground_size, ground_resolution: the ground is endless chunks now
  // Endless ground: hill height and noise scale (bigger = busier), the same function everywhere so chunks meet.
  float ground_height = 4;
  float ground_noise_scale = 5;
  // Chunks around the player: size (metres), vertices per side, and how many chunks out in each direction.
  float chunk_size = 26;
  int32 chunk_resolution = 27;
  int32 view_chunks = 28;
  // Surface colour noise scale (detail on the ground texture).
  float surface_noise_scale = 7;
  // Walking (metres, seconds).
  float walk_speed = 8;
  float sprint_speed = 9;
  float jump_speed = 10;
  float gravity = 11;
  float eye_height = 12;
  float look_degrees_per_pixel = 13;
  // Feel: head bob (metres, steps per second at walk speed), arm sway (degrees per look pixel).
  float bob_amount = 14;
  float bob_frequency = 15;
  float sway = 16;
  // Wake up lying on the ground, then stand.
  float wake_seconds = 17;
  // The wreck: distance from where you wake, and ship length (metres).
  float wreck_distance = 18;
  float wreck_length = 19;
  // Atmosphere haze over the horizon and with distance (0..1).
  float haze = 20;
  // Sun height in the sky (degrees above the horizon).
  float sun_elevation_degrees = 21;
  string hint = 22;
  // Arm life on top of the (very still) idle clip: breathing lift, walking swing, finger fidget (degrees).
  float arm_breath_degrees = 23;
  float arm_swing_degrees = 24;
  float finger_fidget_degrees = 25;
  // The arms rig's bone map (content/hands/*).
  HandRig hands = 29;
  string hands_ref = 30 [(ln.ref) = "hands"];
  // Debug: hands trace circles in front of you and the IK error is logged (checks the rig map + solver).
  bool debug_reach = 31;
  // Reach out and touch surfaces (e.g. the wreck) closer than this (metres from the shoulder).
  float touch_distance = 32;
  // Boulders scattered around the crash site (seeded): how many, how far out, size range (metres).
  int32 boulders = 33;
  float boulder_spread = 34;
  float boulder_size_min = 35;
  float boulder_size_max = 36;
  // Debug: after waking, stand at (x, z) facing `y` degrees (all 0 = off). For testing spots, e.g. touch.
  Vec3 debug_spawn = 37;
}

// Where the intro's ship came down: read by the Planet scene (and later a save file).
message LandingSite {
  option (ln.state) = true;
  bool valid = 1;
  // Body id of the planet (e.g. "home") in the universe of the current lucky number.
  string body = 2;
  reserved 3; // ship_skin: the wreck uses the player's ship (PlayerShip)
}
