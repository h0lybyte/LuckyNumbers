syntax = "proto3";

package luckynumbers.v1;

import "ln/options.proto";
import "luckynumbers/v1/common.proto";

option csharp_namespace = "LuckyNumbers.Model";

// Discrete actions (button presses). Bound to devices in the Input System asset.
enum InputAction {
  INPUT_ACTION_UNSPECIFIED = 0;
  INPUT_ACTION_CONFIRM = 1;
  INPUT_ACTION_CANCEL = 2;
  INPUT_ACTION_PAUSE = 3;
  INPUT_ACTION_JUMP = 4;
  INPUT_ACTION_INTERACT = 5;
  INPUT_ACTION_SPRINT = 6;
  // Any key/button on any device ("Press any key").
  INPUT_ACTION_ANY_BUTTON = 7;
  // Open/close the planet map.
  INPUT_ACTION_MAP = 8;
  // Use the relic you're holding (R).
  INPUT_ACTION_USE_RELIC = 9;
  // Dev (shooting range): cycle the side view of the hands and what they hold (V).
  INPUT_ACTION_SIDE_VIEW = 10;
}

// Continuous axes, sampled every frame.
message PlayerInput {
  option (ln.state) = true;
  Vec2 move = 1;
  Vec2 look = 2;
  // Pointer (mouse/touch): screen pixels, origin bottom-left.
  Vec2 pointer_position = 3;
  Vec2 pointer_delta = 4;
  bool pointer_pressed = 5;
  // Mouse wheel / trackpad scroll this frame (positive = up/away).
  float pointer_scroll = 6;
  // Sprint held.
  bool sprinting = 7;
  // Jump held (flying: the lift thrusters).
  bool lifting = 8;
  // Descend held (C): the ship's hover goes down.
  bool descending = 9;
  // Roll (Q / E: -1 left .. +1 right) and brake held (X): the ship's flight.
  float roll = 10;
  bool braking = 11;
}

message InputActionPerformed {
  option (ln.event) = true;
  option (ln.web_in) = true;
  InputAction action = 1;
}
