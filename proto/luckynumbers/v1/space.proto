syntax = "proto3";

package luckynumbers.v1;

import "ln/options.proto";
import "luckynumbers/v1/common.proto";

option csharp_namespace = "LuckyNumbers.Model";

// 3D universe shown on the title (and reused by the intro). World units: a scale-1 body is 1 unit across.
message SpaceBackdrop {
  reserved 2, 3, 4, 6; // 2D era: planet, planet_position, planet_scale, pan
  StarfieldLook stars = 1;
  repeated CelestialBody bodies = 5;
  CameraOrbit camera = 7;
  // Direction towards the sun, shared by every planet's lighting (normalized at runtime).
  Vec3 sun_direction = 8;
}

// A sphere using LuckyNumbers/Planet3D with its own look.
message CelestialBody {
  string id = 1;
  // World position; for orbiting bodies, an offset from the orbit centre (usually 0,0,0).
  Vec3 position = 2;
  // Diameter in world units.
  float scale = 3;
  PlanetLook look = 4;
  // Optional: circle another body (listed earlier) in the XZ plane. radius 0 = static.
  Orbit orbit = 5;
}

message Orbit {
  string around = 1;
  float radius = 2;
  float period_seconds = 3;
  // Starting angle, 0..1 of a full turn.
  float phase = 4;
}

// Drag rotates the camera around `target`; scroll zooms.
message CameraOrbit {
  // Body id to orbit around.
  string target = 1;
  float distance = 2;
  float min_distance = 3;
  float max_distance = 4;
  float yaw_degrees = 5;
  float pitch_degrees = 6;
  float min_pitch_degrees = 7;
  float max_pitch_degrees = 8;
  // Degrees of rotation for a drag across the full screen width.
  float drag_degrees_per_screen = 9;
  // Inertia after release: share of spin kept per 1/60 s (0 = stop, 0.95 = long glide).
  float glide = 10;
  // Distance change per scroll notch, as a share of the current distance.
  float zoom_step = 11;
  // Shifts the framing (camera-space x/y, world units) so the target can sit off-centre.
  Vec2 frame_offset = 12;
  float field_of_view_degrees = 13;
}

// Shader properties of LuckyNumbers/Starfield (skybox: stars + nebula on the celestial sphere).
message StarfieldLook {
  option (ln.material) = "LuckyNumbers/Starfield";
  reserved 11; // 2D era: parallax
  Rgba space_color = 1;
  Rgba nebula_color_a = 2;
  Rgba nebula_color_b = 3;
  optional float nebula_intensity = 4;
  optional float nebula_scale = 5;
  optional float star_density = 6;
  optional float star_brightness = 7;
  optional float twinkle_speed = 8;
  // Slow sky rotation, radians per second around (y, x).
  Vec2 drift = 9;
  optional float seed = 10;
}

// Shader properties of LuckyNumbers/Planet3D.
message PlanetLook {
  option (ln.material) = "LuckyNumbers/Planet3D";
  reserved 4, 5, 8, 9, 10, 11, 13; // 2D era: planet_size, edge_smoothness, rotation_axis, light_origin,
                                   // light_shadow_hardness, light_size, shadow_size
  Rgba planet_color = 1;
  Rgba atmosphere_color = 2;
  Rgba light_color = 3;
  // Glow shell thickness, share of the radius.
  optional float atmosphere_thickness = 6;
  // Turns per second around the (tilted) axis.
  optional float rotation_speed = 7;
  optional float light_intensity = 12;
  optional float shadow_intensity = 14;
  Vec3 noise_offset = 15;
  optional float noise_scale = 16;
  // 0 = original look (noise can go negative, giving complementary colours), 1 = true colour.
  optional float noise_remap = 17;
  optional float atmosphere_intensity = 18;
  // Higher = glow hugs the surface more tightly.
  optional float atmosphere_power = 19;
  // Width of the day/night blend on the surface.
  optional float terminator_softness = 20;
  optional float axial_tilt_degrees = 21;
}
