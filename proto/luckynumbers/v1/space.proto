syntax = "proto3";

package luckynumbers.v1;

import "ln/options.proto";
import "luckynumbers/v1/common.proto";

option csharp_namespace = "LuckyNumbers.Model";

// Space background shown on the title (and reused by the intro).
// World units: orthographic camera, 1 unit = half the screen height.
message SpaceBackdrop {
  reserved 2, 3, 4; // old single planet (planet, planet_position, planet_scale)
  StarfieldLook stars = 1;
  // Drawn in list order (later = in front).
  repeated CelestialBody bodies = 5;
  CameraPan pan = 6;
}

// A planet/moon quad using LuckyNumbers/Planet2D with its own look.
message CelestialBody {
  string id = 1;
  // World position; for orbiting bodies, the orbit centre offset (usually 0,0).
  Vec2 position = 2;
  float scale = 3;
  PlanetLook look = 4;
  // Optional: circle another body (by id). radius 0 = static.
  Orbit orbit = 5;
}

message Orbit {
  string around = 1;
  float radius = 2;
  float period_seconds = 3;
  // Starting angle, 0..1 of a full turn.
  float phase = 4;
}

// Click-drag to look around the universe.
message CameraPan {
  // 1 = the universe follows the pointer exactly.
  float drag_speed = 1;
  // Camera may move within +-bounds of the start position.
  Vec2 bounds = 2;
  // Inertia after release: velocity kept per second (0 = stop instantly, 0.9 = long glide).
  float glide = 3;
}

// Shader properties of LuckyNumbers/Starfield.
message StarfieldLook {
  option (ln.material) = "LuckyNumbers/Starfield";
  Rgba space_color = 1;
  Rgba nebula_color_a = 2;
  Rgba nebula_color_b = 3;
  float nebula_intensity = 4;
  float nebula_scale = 5;
  float star_density = 6;
  float star_brightness = 7;
  float twinkle_speed = 8;
  Vec2 drift = 9;
  float seed = 10;
  // How far each layer moves when the camera pans (0 = fixed to screen, 1 = world-locked).
  float parallax = 11;
}

// Shader properties of LuckyNumbers/Planet2D.
message PlanetLook {
  option (ln.material) = "LuckyNumbers/Planet2D";
  Rgba planet_color = 1;
  Rgba atmosphere_color = 2;
  Rgba light_color = 3;
  float planet_size = 4;
  float edge_smoothness = 5;
  float atmosphere_thickness = 6;
  float rotation_speed = 7;
  float rotation_axis = 8;
  Vec2 light_origin = 9;
  float light_shadow_hardness = 10;
  float light_size = 11;
  float light_intensity = 12;
  float shadow_size = 13;
  float shadow_intensity = 14;
  Vec2 noise_offset = 15;
}
