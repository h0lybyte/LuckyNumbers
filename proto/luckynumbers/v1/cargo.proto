syntax = "proto3";

package luckynumbers.v1;

import "ln/options.proto";
import "luckynumbers/v1/common.proto";
import "luckynumbers/v1/cutscene.proto";

option csharp_namespace = "LuckyNumbers.Model";

// The museum freighter and its cargo, from the lucky number (Cargo.Manifest). The relics themselves are items
// (content/items.txtpb, each named relic its own file under content/items/relics, docs/items.md).
message CargoConfig {
  option (ln.config) = true;
  // Picked from by the seed: the ship, and the museum it flies for.
  repeated string ship_names = 1;
  repeated string museums = 2;
  // 3-8: generated relics (cultures, kinds) and RelicArtifact, gone: relics are items now.
  reserved 3, 4, 5, 6, 7, 8;
  // What's aboard: item ids (ItemDef with kind RELIC, unique), always all of them, first in the hold.
  repeated string relics = 15;
  // Your luck die (the title's dice) adds up to this to every relic roll.
  int32 luck_bonus = 9;
  // At the crash site the relics lie scattered this far (metres) from the wreck; E picks one up from this close.
  float scatter_min = 10;
  float scatter_max = 11;
  float pickup_distance = 12;
  // Prompts ({name}): picking up, and using what you carry.
  string pickup_prompt = 13;
  string use_prompt = 14;
  // Salvage jobs: walk up to the wreck (this many metres past its hull) and E flags it for processing, which meets
  // the job's goal; the lines say so and send you back to your ship. Relics stay out for extra credits.
  float salvage_distance = 16;
  string salvage_prompt = 17;
  repeated Dialogue salvage_lines = 18;
  // Shown once it's flagged and you're near the wreck again.
  string salvaged_prompt = 19;
}

enum RelicEffect {
  RELIC_EFFECT_NONE = 0;
  // Health back: `amount` points.
  RELIC_EFFECT_HEAL = 1;
  // Health back to full.
  RELIC_EFFECT_FULL_HEAL = 2;
  // You move at `amount` of your speed for `seconds`.
  RELIC_EFFECT_SLOW = 3;
  // A beam over the nearest relic still lying out, and its bearing on the HUD, for `seconds`.
  RELIC_EFFECT_REVEAL_NEAREST = 4;
  // Beams over every relic still lying out, for `seconds`.
  RELIC_EFFECT_REVEAL_ALL = 5;
}

message RelicRoll {
  int32 min = 1;
  int32 max = 2;
  string title = 3;
  string text = 4;
  repeated RelicEffect effects = 5;
  float amount = 6;
  float seconds = 7;
}

// A relic was used (Core/InventoryPresenter): the d20, your bonuses (luck die + sheet), the total, and what it did.
message RelicRolled {
  option (ln.event) = true;
  option (ln.web) = true;
  string relic = 1;
  int32 roll = 2;
  int32 bonus = 3;
  int32 total = 4;
  string title = 5;
  string text = 6;
}

// Dev (the page's inspector): put you on foot beside "artifact" (the nearest named one still lying out), "relic"
// (the nearest of any), the "wreck" or your landed "ship"; "land" (while flying in) sets the ship down on the pad.
// For trying things out quickly.
message DevWarpRequested {
  option (ln.event) = true;
  option (ln.web_in) = true;
  string to = 1;
}

// The crash site's relics, for the page: how many still lie out, and a revealed one's bearing ("Water Amulet:
// 23 m north-east").
message RelicSite {
  option (ln.state) = true;
  option (ln.web) = true;
  int32 lying = 1;
  string reveal = 2;
}
