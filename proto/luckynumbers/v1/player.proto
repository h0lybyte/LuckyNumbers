syntax = "proto3";

package luckynumbers.v1;

import "ln/options.proto";

option csharp_namespace = "LuckyNumbers.Model";

message PlayerConfig {
  option (ln.config) = true;
  int32 max_health = 1;
  // Default ship skin (file name in Art/Models/Fighter/Skins); the player can change it later (PlayerShip).
  string ship_skin = 2;
}

// The player's ship as they've set it up (starts from PlayerConfig; a customise screen / save file sets it).
message PlayerShip {
  option (ln.state) = true;
  option (ln.web) = true;
  string skin = 1;
}

message PlayerHealth {
  option (ln.state) = true;
  option (ln.web) = true;
  int32 current = 1;
  int32 max = 2;
}

message PlayerDamaged {
  option (ln.event) = true;
  option (ln.web) = true;
  int32 amount = 1;
  string source = 2;
}

message PlayerHealed {
  option (ln.event) = true;
  option (ln.web) = true;
  int32 amount = 1;
}

message PlayerDied {
  option (ln.event) = true;
  option (ln.web) = true;
  string cause = 1;
}

// Something the player's hands picked up, dropped or threw (web: a toast, top right, for checking holds).
message ItemHandled {
  option (ln.event) = true;
  option (ln.web) = true;
  string item = 1;     // what it is ("rifle_block")
  string action = 2;   // "picked up", "dropped", "threw", "holding"
  string detail = 3;   // e.g. "gun - scale 1.00", or the hands' IK error once settled
}

// The hangar, after character creation on the title (Title/ShipPickerPresenter): your fighter turns in front of
// the camera while the page cycles its skins, then launches. `skin` is the file name (Art/Models/Fighter/Skins),
// `index` of `count`. The choice goes to PlayerShip.
message ShipPicker {
  option (ln.state) = true;
  option (ln.web) = true;
  bool open = 1;
  string skin = 2;
  int32 index = 3;
  int32 count = 4;
}

// The page has a ship picker (sent when it mounts): Play then opens the hangar after character creation.
// Without it (no page, e.g. the editor) Play goes straight on with the default skin.
message ShipPickerReady {
  option (ln.event) = true;
  option (ln.web_in) = true;
  bool on = 1;
}

// The page's picker: the next (+1) or previous (-1) skin.
message ShipSkinStepRequested {
  option (ln.event) = true;
  option (ln.web_in) = true;
  int32 step = 1;
}

// The page's picker: Launch pressed.
message ShipPickDone {
  option (ln.event) = true;
  option (ln.web_in) = true;
}
