syntax = "proto3";

package luckynumbers.v1;

import "ln/options.proto";

option csharp_namespace = "LuckyNumbers.Model";

message PlayerConfig {
  option (ln.config) = true;
  int32 max_health = 1;
  // Default ship skin (file name in Art/Models/Fighter/Skins); the player can change it later (PlayerShip).
  string ship_skin = 2;
}

// The player's ship as they've set it up (starts from PlayerConfig; a customise screen / save file sets it).
message PlayerShip {
  option (ln.state) = true;
  option (ln.web) = true;
  string skin = 1;
  // Fuel in the tank and the tank's size (units; content/ships.txtpb fuel x the skin's stats). Kept between
  // scenes: the station fills it, flying burns it.
  float fuel = 2;
  float fuel_max = 3;
  // Upgrades bought at the outfitter (content/upgrades.txtpb), each "id|level".
  repeated string upgrades = 4;
  // The dice drive's roll for this launch (rerolled every time you leave the station; 0 = none yet).
  uint32 dice = 5;
}

message PlayerHealth {
  option (ln.state) = true;
  option (ln.web) = true;
  int32 current = 1;
  int32 max = 2;
}

// Why the player can't walk and look right now, one bit per owner. Each system sets and clears only its own bit
// (IFirstPerson.Lock / Unlock); the player has control when none is set. Overlaps resolve themselves: closing the
// map while an encounter card is up clears MAP only, and the card still holds you.
enum ControlLock {
  option (ln.flags) = true;
  CONTROL_LOCK_NONE = 0;
  // The scene hasn't handed you control yet (set from the start; the wake-up, the station spawn clear it).
  CONTROL_LOCK_SPAWN = 1;
  // In the ship's seat: flying down, or boarded to fly back out.
  CONTROL_LOCK_VEHICLE = 2;
  // The planet map is open (or opening / closing). Frees the pointer.
  CONTROL_LOCK_MAP = 4;
  // An encounter card is up: time stands still. Frees the pointer.
  CONTROL_LOCK_ENCOUNTER = 8;
  // Knocked down: the rescue drone takes it from here.
  CONTROL_LOCK_DOWNED = 16;
  // Fading out to another scene.
  CONTROL_LOCK_LEAVING = 32;
}

// Who holds the player right now (FirstPersonPresenter writes it; each on-foot scene starts at SPAWN, and it
// keeps the last one's outside them).
message PlayerControl {
  option (ln.state) = true;
  option (ln.web) = true;
  ControlLock locks = 1;
}

message PlayerDamaged {
  option (ln.event) = true;
  option (ln.web) = true;
  int32 amount = 1;
  string source = 2;
}

message PlayerHealed {
  option (ln.event) = true;
  option (ln.web) = true;
  int32 amount = 1;
}

message PlayerDied {
  option (ln.event) = true;
  option (ln.web) = true;
  string cause = 1;
}

// Something the player's hands picked up, dropped or threw, or a find opened on the planet (web: a toast, top right).
message ItemHandled {
  option (ln.event) = true;
  option (ln.web) = true;
  string item = 1;     // what it is ("rifle_block")
  string action = 2;   // "picked up", "dropped", "threw", "holding", "opened", "failed to open"
  string detail = 3;   // e.g. "gun - scale 1.00", or the hands' IK error once settled
}

// The hangar, after character creation on the title (Title/ShipPickerPresenter): your fighter turns in front of
// the camera while the page cycles its skins, then launches. `skin` is the file name (Art/Models/Fighter/Skins),
// `index` of `count`. The choice goes to PlayerShip.
message ShipPicker {
  option (ln.state) = true;
  option (ln.web) = true;
  bool open = 1;
  string skin = 2;
  int32 index = 3;
  int32 count = 4;
  // That skin's stats (content/ships.txtpb; multipliers, 1 = baseline) and the guns in its barrels.
  string name = 5;
  string role = 6;
  string description = 7;
  float speed = 8;
  float agility = 9;
  float fuel = 10;
  float efficiency = 11;
  float toughness = 12;
  float firepower = 13;
  string guns = 14;
}

// The page has a ship picker (sent when it mounts): Play then opens the hangar after character creation.
// Without it (no page, e.g. the editor) Play goes straight on with the default skin.
message ShipPickerReady {
  option (ln.event) = true;
  option (ln.web_in) = true;
  bool on = 1;
}

// The page's picker: the next (+1) or previous (-1) skin.
message ShipSkinStepRequested {
  option (ln.event) = true;
  option (ln.web_in) = true;
  int32 step = 1;
}

// The page's picker: Launch pressed.
message ShipPickDone {
  option (ln.event) = true;
  option (ln.web_in) = true;
}

// Where you're coming back to the station from: one at a time; the station reads it as it loads, then clears it.
enum StationArrival {
  // Not coming back from anywhere: the station's spawn.
  STATION_ARRIVAL_NONE = 0;
  // Out of the planet's atmosphere (or rescued): beside your ship, and the museum calls (the homecoming).
  STATION_ARRIVAL_PLANET = 1;
  // From the Flight School: beside its console (not by your ship, no homecoming).
  STATION_ARRIVAL_FLIGHT_SCHOOL = 2;
  // Docked again after flying round outside (GameScene.Orbit): beside your ship (no homecoming, unless on a job).
  STATION_ARRIVAL_ORBIT = 3;
  // Your ship was destroyed: your memory chip woke you in a new body; the rebuilt ship is in the bay, Dispatch bills you.
  STATION_ARRIVAL_RESTORED = 4;
}

// The trip so far (app-wide): set when you fly out of the planet's atmosphere, so the station knows you're back;
// and your credits (the museum pays for relics you bring back), with the last payout for the page's toast.
message PlayerVoyage {
  option (ln.state) = true;
  option (ln.web) = true;
  // 1, 6, 7: the returning / training / docked bools, now `arrival` (only one could ever be meant).
  reserved 1, 6, 7;
  reserved "returning", "training", "docked";
  StationArrival arrival = 8;
  int32 credits = 2;
  int32 last_payout = 3;
  // Trips down to a planet so far: the first one plays the intro cutscene, later ones fly straight down.
  int32 trips = 4;
  // Brought back by the rescue drone (you went down on the planet): the station's call says so.
  bool rescued = 5;
  // The last memory restore's bill (rebuild + fee), for Dispatch's call.
  int32 restore_bill = 9;
}
