syntax = "proto3";

package luckynumbers.v1;

import "ln/options.proto";

option csharp_namespace = "LuckyNumbers.Model";

// Outside the station (content/orbit.txtpb, Station/OrbitPresenter): the Docking Bay's launch console puts you in
// your ship just off the bay's outer wall, in space round your station (your universe behind it, the planet it
// orbits to the north). It flies like the Flight School (the planet's hover handling, no gravity, no fuel). Fly
// back into the docking beacon slowly and E docks: you step off beside your ship in the bay.
// The hull is the station's own seeded plan, one placeholder block per stretch of rooms and walls, scaled so your
// fighter at its flying size fits the bay as the docked ship does inside.
message OrbitScene {
  option (ln.config) = true;
  // Shown at the top, and the controls under it.
  string title = 1;
  string hint = 2;
  // Inside the docking beacon and slow enough: what E does.
  string dock_prompt = 3;
  // Inside it but too fast.
  string slow_prompt = 4;
  // The beacon: how far off the bay's outer wall (ship lengths) and its radius (ship lengths).
  float dock_offset = 5;
  float dock_radius = 6;
  // Slowest speed counted as stopped enough to dock, as a share of the ship's top speed.
  float dock_speed = 7;
  // Where you start: ship lengths out from the beacon, heading away from the station.
  float start_distance = 8;
  // Hull blocks' height (m, station scale before scaling) and how far the camera may be from the hull (ship lengths)
  // before space is all there is: past `range` ship lengths from the station a hint says to turn back.
  float hull_height = 9;
  float range = 10;
  // Chase camera (ship lengths), as the Flight School's.
  float chase_distance = 11;
  float chase_height = 12;
  float readout_seconds = 13;
  // On a touch screen (PointerLock.Touch), in place of the keyboard / mouse line above; empty: that one.
  string touch_hint = 14;
  // Camera shake (trauma: hits and crashes add to it, it fades at `shake_decay` a second; the shake is trauma
  // squared): at most `shake_angle` degrees and `shake_offset` ship lengths. `fov_kick`: degrees the view widens
  // at full boost speed. `dust`: motes drifting round you (count), so speed reads in empty space; 0 = none.
  float shake_angle = 15;
  float shake_offset = 16;
  float shake_decay = 17;
  float fov_kick = 18;
  int32 dust = 19;
  // Space round the station, alive: traffic, debris, its lights and its turn.
  OrbitLife life = 20;
}

// Outside the station, things moving (Station/OrbitLife): no gameplay, looks only, cheap.
message OrbitLife {
  // Traffic: up to `traffic` ships at once (fighter skins) crossing past the station `traffic_distance` ship lengths
  // out (nearest pass, plus the hull), at `traffic_speed` m/s, one every `traffic_seconds` (about: x0.5 to x1.5).
  int32 traffic = 1;
  float traffic_distance = 2;
  float traffic_speed = 3;
  float traffic_seconds = 4;
  // Debris (PLACEHOLDER_debris: instanced cubes) tumbling in a shell round the hull, `debris_radius` ship lengths
  // deep, `debris_size` ship lengths across at most, tumbling at up to `debris_spin` degrees a second.
  int32 debris = 5;
  float debris_radius = 6;
  float debris_size = 7;
  float debris_spin = 8;
  // Navigation lights (PLACEHOLDER_nav_light) on the hull's top corners: a blink every `blink_seconds`.
  float blink_seconds = 9;
  // The station turns in its orbit (degrees a second: the planet and stars wheel slowly round it), and the space
  // camera moves with you (`parallax`: share of the planet's diameter at the edge of `range`), so the planet shifts.
  float spin = 10;
  float parallax = 11;
  // A radar mast on the roof (PLACEHOLDER_radar_mast), turning at `radar_spin` degrees a second.
  float radar_spin = 12;
}
