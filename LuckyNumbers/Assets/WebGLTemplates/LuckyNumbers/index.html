<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="{{{ BACKGROUND_COLOR }}}">
    <title>{{{ PRODUCT_NAME }}}</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,400;0,600;0,700;1,400&family=Share+Tech+Mono&display=swap" crossorigin>
    <link rel="stylesheet" href="TemplateData/style.css">
#if SHOW_DIAGNOSTICS
    <link rel="stylesheet" href="<<<TemplateData/diagnostics.css>>>">
    <script src="<<<TemplateData/diagnostics.js>>>"></script>
#endif
#if DEVELOPMENT_PLAYER
    <script src="<<<TemplateData/profiler.js>>>"></script>
#endif
  </head>
  <body>
    <div id="app">
      <!-- Fullscreen root: canvas + every layer over it. -->
      <main id="stage">
        <canvas id="unity-canvas" width="{{{ WIDTH }}}" height="{{{ HEIGHT }}}" tabindex="-1"></canvas>

        <!-- HTML overlay above the game. Clicks pass through unless an element has class "ui". -->
        <div id="overlay">
          <div id="toolbar" class="ui">
#if SHOW_DIAGNOSTICS
            <img id="diagnostics-icon" src="TemplateData/webmemd-icon.png" alt="Diagnostics">
#endif
            <button id="unity-fullscreen-button" class="icon-button" type="button" title="Fullscreen" aria-label="Fullscreen" hidden>
              <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
                <path d="M2 6.5V2h4.5M16 6.5V2h-4.5M2 11.5V16h4.5M16 11.5V16h-4.5"/>
              </svg>
            </button>
          </div>
        </div>

        <div id="unity-loading-container">
          <div id="unity-loading-bar">
            <div id="loading-title">{{{ PRODUCT_NAME }}}</div>
            <div id="unity-progress-bar-empty">
              <div id="unity-progress-bar-full"></div>
            </div>
          </div>
        </div>

        <div id="unity-warning"></div>
      </main>

      <!-- Reserved side dock (bottom sheet on narrow screens). Hidden until something mounts in it. -->
      <aside id="dock" hidden></aside>
    </div>

    <script>
      // window.LN: the page side of the Unity bridge (WebBridge.cs / WebBridge.jslib).
      // Unity pushes one batch per frame ({s: changed states, e: events}); the page queues events
      // for Unity, which drains them once per frame. Types: web/src/generated/ln.g.ts.
      window.LN = (function () {
        var states = {};
        var stateSubs = {};   // name -> [fn(snapshot)]; "*" -> [fn(snapshot, name)]
        var eventSubs = {};   // name -> [fn(payload)]; "*" -> [fn(payload, name)]
        var readySubs = [];
        var outbox = [];
        var ready = false;

        function add(map, name, fn) {
          (map[name] = map[name] || []).push(fn);
          return function () {
            var list = map[name];
            var i = list ? list.indexOf(fn) : -1;
            if (i >= 0) list.splice(i, 1);
          };
        }
        function call(list, a, b) {
          if (!list) return;
          for (var i = 0, l = list.slice(); i < l.length; i++) {
            try { l[i](a, b); } catch (e) { console.error("[LN]", e); }
          }
        }

        return {
          /** Latest snapshot of every state, by name (each snapshot is a fresh object). */
          states: states,
          get ready() { return ready; },
          getState: function (name) { return states[name]; },
          /** fn(snapshot) now (if known) and on every change; name "*" gets fn(snapshot, name). Returns unsubscribe. */
          subscribe: function (name, fn) {
            if (name !== "*" && name in states) fn(states[name]);
            return add(stateSubs, name, fn);
          },
          /** fn(payload) for each event; name "*" gets fn(payload, name). Returns unsubscribe. */
          on: function (name, fn) { return add(eventSubs, name, fn); },
          /** fn() once Unity's bridge is up (now, if it already is). */
          onReady: function (fn) { if (ready) fn(); else readySubs.push(fn); },
          /** Publish an inbound (ln.web) event into the game; delivered on Unity's next frame. */
          send: function (name, payload) { outbox.push([name, payload || {}]); },

          _fromUnity: function (json) {
            var batch = JSON.parse(json);
            for (var name in batch.s) {
              states[name] = batch.s[name];
              call(stateSubs[name], states[name]);
              call(stateSubs["*"], states[name], name);
            }
            for (var i = 0; i < batch.e.length; i++) {
              call(eventSubs[batch.e[i][0]], batch.e[i][1]);
              call(eventSubs["*"], batch.e[i][1], batch.e[i][0]);
            }
          },
          _drain: function () {
            if (!outbox.length) return null;
            var json = JSON.stringify(outbox);
            outbox = [];
            return json;
          },
          _ready: function () {
            ready = true;
            call(readySubs.splice(0));
          },
        };
      })();

      // HTML overlays (web/, built into overlay/). Optional: the game runs without them.
      (function () {
        var s = document.createElement("script");
        s.type = "module";
        s.src = "overlay/overlay.js";
        s.onerror = function () { console.info("[web] no overlay build (overlay/overlay.js)"); };
        document.head.appendChild(s);
      })();

      var canvas = document.querySelector("#unity-canvas");
      var stage = document.querySelector("#stage");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");

      // Temporary banner for warnings/info (auto-dismiss after 5 s); errors stay.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? "block" : "none";
        }
        var div = document.createElement("div");
        div.textContent = msg;
        if (type) div.className = type;
        warningBanner.appendChild(div);
        if (type != "error") {
          setTimeout(function () {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      var config = {
        arguments: [],
#if PROGRESSIVE_ASSET_LOADING
        primaryDataUrls: {{{ JSON.stringify(PRIMARY_DATA_FILES) }}},
        secondaryDataUrls: {{{ JSON.stringify(SECONDARY_DATA_FILES) }}},
#else
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
#endif
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",

        // Fullscreen the whole stage (canvas + overlay), not just the canvas.
        fullscreenElementID: "stage",

        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: unityShowBanner,
        // LuckyNumbers: a refused pointer lock (iframe policy, headless browser, user setting) is not fatal;
        // the game keeps running and mouse look falls back to click-drag. Everything else goes to Unity.
        errorHandler: function (err, url, line) {
          var text = String(err && (err.message || err)) + " " + String(err && err.name);
          if (/pointer ?lock|WrongDocumentError/i.test(text)) {
            console.warn("[web] pointer lock refused; continuing (" + text.trim() + ")");
            return true;
          }
          return false;
        },
      };

      // Unity keeps the render target matched to the canvas's CSS size x devicePixelRatio,
      // so the canvas resizes with the window. Cap the ratio so 3x phones don't render 9x the pixels; on a touch
      // screen (a phone's small, hot GPU) cap it harder: 1.25x of the CSS size still looks sharp at arm's length.
      // ?ln-dpr=<n> overrides (e.g. 1 for speed, 2 for screenshots).
      var dprQuery = parseFloat(new URLSearchParams(location.search).get("ln-dpr"));
      var dprCap = matchMedia("(pointer: coarse)").matches ? 1.25 : 2;
      config.devicePixelRatio = dprQuery > 0 ? dprQuery : Math.min(window.devicePixelRatio || 1, dprCap);

      // Texture format. The build's data and bundles use DXT (desktop GPUs); WebBuild.cs adds an ASTC copy of both
      // (and flips lnAstc). A GPU with ASTC and no DXT (phones, tablets) loads that one, so its textures stay
      // compressed instead of Unity unpacking each on the CPU into 4-8x the memory. ?ln-tex=astc|dxt forces one.
      var lnAstc = false;
      var texQuery = new URLSearchParams(location.search).get("ln-tex");
      var useAstc = lnAstc && (texQuery ? texQuery === "astc" : (function () {
        try {
          var gl = document.createElement("canvas").getContext("webgl2");
          if (!gl) return false;
          var astc = !gl.getExtension("WEBGL_compressed_texture_s3tc") && !!gl.getExtension("WEBGL_compressed_texture_astc");
          var lose = gl.getExtension("WEBGL_lose_context");
          if (lose) lose.loseContext();
          return astc;
        } catch (e) {
          return false;
        }
      })());
#if PROGRESSIVE_ASSET_LOADING
#else
      if (useAstc) {
        config.dataUrl = config.dataUrl.replace(/\/([^/.]+)(\.data[^/]*)$/, "/$1-astc$2");
        config.streamingAssetsUrl = "StreamingAssets-astc";
      }
#endif
      window.lnTextures = useAstc ? "ASTC" : "DXT"; // the ?ln-fps meter shows it
      console.log("[web] textures: " + (useAstc ? "ASTC" : "DXT") + (lnAstc ? "" : " (no ASTC copy in this build)"));

      // If you would like all file writes inside Unity Application.persistentDataPath
      // to persist across visits, uncomment:
      // config.autoSyncPersistentDataPath = true;

#if BACKGROUND_FILENAME
      canvas.style.background = "url('" + buildUrl + "/{{{ BACKGROUND_FILENAME.replace(/'/g, '%27') }}}') center / cover";
#endif

      // The Fullscreen API isn't available everywhere (iOS Safari on iPhone, some iframes).
      var canFullscreen = document.fullscreenEnabled || document.webkitFullscreenEnabled;

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function () {
        var loadingContainer = document.querySelector("#unity-loading-container");
        var progressBarFull = document.querySelector("#unity-progress-bar-full");

        createUnityInstance(canvas, config, function (progress) {
          loadingContainer.classList.toggle("visible", progress < 1);
          progressBarFull.style.width = 100 * progress + "%";
        }).then(function (unityInstance) {
          window.unityInstance = unityInstance; // handle for page-side code (overlays, dock)

#if SHOW_DIAGNOSTICS
          document.getElementById("diagnostics-icon").onclick = function () {
            unityDiagnostics.openDiagnosticsDiv(unityInstance.GetMetricsInfo);
          };
#endif
          if (canFullscreen) {
            fullscreenButton.hidden = false;
            fullscreenButton.onclick = function () {
              unityInstance.SetFullscreen(1);
              canvas.focus();
            };
          }

#if DEVELOPMENT_PLAYER
          var toolbar = document.querySelector("#toolbar");
          toolbar.prepend(unityProfiler.createButton(unityInstance));

          // Dev-only: unload the Unity instance so the browser can reclaim its memory.
          var quit = document.createElement("button");
          quit.type = "button";
          quit.textContent = "Unload";
          toolbar.prepend(quit);
          quit.onclick = function () {
            unityInstance.Quit().then(function () {
              unityProfiler.shutDown();
              document.querySelector("#app").remove();
              canvas = null;
              stage = null;
              window.unityInstance = null;
              script.remove();
              script = null;
            });
          };
#endif
        }).catch(function (message) {
          unityShowBanner(String(message), "error");
        });
      };

      // Saves from older releases. Unity keeps PlayerPrefs in IndexedDB under /idbfs/<md5 of the page's folder URL>,
      // and itch.io gives every upload a new folder, so a new build can't see the last one's saves. Before Unity
      // starts: if this folder has no PlayerPrefs yet, copy in the newest one another build left. The game then moves
      // them to localStorage (LocalStore.cs), which lasts across builds. Never blocks the start for long.
      function lnMd5(str) {
        function add(x, y) { var l = (x & 0xffff) + (y & 0xffff); return (((x >> 16) + (y >> 16) + (l >> 16)) << 16) | (l & 0xffff); }
        function rol(n, c) { return (n << c) | (n >>> (32 - c)); }
        function cmn(q, a, b, x, s, t) { return add(rol(add(add(a, q), add(x, t)), s), b); }
        function ff(a, b, c, d, x, s, t) { return cmn((b & c) | (~b & d), a, b, x, s, t); }
        function gg(a, b, c, d, x, s, t) { return cmn((b & d) | (c & ~d), a, b, x, s, t); }
        function hh(a, b, c, d, x, s, t) { return cmn(b ^ c ^ d, a, b, x, s, t); }
        function ii(a, b, c, d, x, s, t) { return cmn(c ^ (b | ~d), a, b, x, s, t); }
        var bytes = new TextEncoder().encode(str), n = bytes.length;
        var words = new Array((((n + 8) >> 6) + 1) * 16).fill(0);
        for (var i = 0; i < n; i++) words[i >> 2] |= bytes[i] << ((i % 4) * 8);
        words[n >> 2] |= 0x80 << ((n % 4) * 8);
        words[words.length - 2] = n * 8;
        var a = 1732584193, b = -271733879, c = -1732584194, d = 271733878;
        for (i = 0; i < words.length; i += 16) {
          var oa = a, ob = b, oc = c, od = d, x = words.slice(i, i + 16);
          a = ff(a, b, c, d, x[0], 7, -680876936); d = ff(d, a, b, c, x[1], 12, -389564586); c = ff(c, d, a, b, x[2], 17, 606105819); b = ff(b, c, d, a, x[3], 22, -1044525330);
          a = ff(a, b, c, d, x[4], 7, -176418897); d = ff(d, a, b, c, x[5], 12, 1200080426); c = ff(c, d, a, b, x[6], 17, -1473231341); b = ff(b, c, d, a, x[7], 22, -45705983);
          a = ff(a, b, c, d, x[8], 7, 1770035416); d = ff(d, a, b, c, x[9], 12, -1958414417); c = ff(c, d, a, b, x[10], 17, -42063); b = ff(b, c, d, a, x[11], 22, -1990404162);
          a = ff(a, b, c, d, x[12], 7, 1804603682); d = ff(d, a, b, c, x[13], 12, -40341101); c = ff(c, d, a, b, x[14], 17, -1502002290); b = ff(b, c, d, a, x[15], 22, 1236535329);
          a = gg(a, b, c, d, x[1], 5, -165796510); d = gg(d, a, b, c, x[6], 9, -1069501632); c = gg(c, d, a, b, x[11], 14, 643717713); b = gg(b, c, d, a, x[0], 20, -373897302);
          a = gg(a, b, c, d, x[5], 5, -701558691); d = gg(d, a, b, c, x[10], 9, 38016083); c = gg(c, d, a, b, x[15], 14, -660478335); b = gg(b, c, d, a, x[4], 20, -405537848);
          a = gg(a, b, c, d, x[9], 5, 568446438); d = gg(d, a, b, c, x[14], 9, -1019803690); c = gg(c, d, a, b, x[3], 14, -187363961); b = gg(b, c, d, a, x[8], 20, 1163531501);
          a = gg(a, b, c, d, x[13], 5, -1444681467); d = gg(d, a, b, c, x[2], 9, -51403784); c = gg(c, d, a, b, x[7], 14, 1735328473); b = gg(b, c, d, a, x[12], 20, -1926607734);
          a = hh(a, b, c, d, x[5], 4, -378558); d = hh(d, a, b, c, x[8], 11, -2022574463); c = hh(c, d, a, b, x[11], 16, 1839030562); b = hh(b, c, d, a, x[14], 23, -35309556);
          a = hh(a, b, c, d, x[1], 4, -1530992060); d = hh(d, a, b, c, x[4], 11, 1272893353); c = hh(c, d, a, b, x[7], 16, -155497632); b = hh(b, c, d, a, x[10], 23, -1094730640);
          a = hh(a, b, c, d, x[13], 4, 681279174); d = hh(d, a, b, c, x[0], 11, -358537222); c = hh(c, d, a, b, x[3], 16, -722521979); b = hh(b, c, d, a, x[6], 23, 76029189);
          a = hh(a, b, c, d, x[9], 4, -640364487); d = hh(d, a, b, c, x[12], 11, -421815835); c = hh(c, d, a, b, x[15], 16, 530742520); b = hh(b, c, d, a, x[2], 23, -995338651);
          a = ii(a, b, c, d, x[0], 6, -198630844); d = ii(d, a, b, c, x[7], 10, 1126891415); c = ii(c, d, a, b, x[14], 15, -1416354905); b = ii(b, c, d, a, x[5], 21, -57434055);
          a = ii(a, b, c, d, x[12], 6, 1700485571); d = ii(d, a, b, c, x[3], 10, -1894986606); c = ii(c, d, a, b, x[10], 15, -1051523); b = ii(b, c, d, a, x[1], 21, -2054922799);
          a = ii(a, b, c, d, x[8], 6, 1873313359); d = ii(d, a, b, c, x[15], 10, -30611744); c = ii(c, d, a, b, x[6], 15, -1560198380); b = ii(b, c, d, a, x[13], 21, 1309151649);
          a = ii(a, b, c, d, x[4], 6, -145523070); d = ii(d, a, b, c, x[11], 10, -1120210379); c = ii(c, d, a, b, x[2], 15, 718787259); b = ii(b, c, d, a, x[9], 21, -343485551);
          a = add(a, oa); b = add(b, ob); c = add(c, oc); d = add(d, od);
        }
        var hex = "";
        [a, b, c, d].forEach(function (w) { for (var j = 0; j < 4; j++) hex += ((w >>> (j * 8)) & 0xff).toString(16).padStart(2, "0"); });
        return hex;
      }
      window.lnMd5 = lnMd5;

      function lnRescueSaves() {
        return new Promise(function (done) {
          var timer = setTimeout(done, 1500);
          var finish = function (note) { clearTimeout(timer); if (note) console.log("[web] saves: " + note); done(); };
          try {
            var dir = "/idbfs/" + lnMd5(location.origin + location.pathname.replace(/\/[^\/]*$/, ""));
            var req = indexedDB.open("/idbfs");
            req.onupgradeneeded = function (e) { e.target.transaction.abort(); };   // no saves at all: leave it to Unity
            req.onerror = function () { finish(); };
            req.onsuccess = function () {
              var db = req.result;
              if (!db.objectStoreNames.contains("FILE_DATA")) { db.close(); return finish(); }
              var store = db.transaction("FILE_DATA", "readwrite").objectStore("FILE_DATA");
              store.transaction.oncomplete = function () { db.close(); };
              var keys = store.getAllKeys();
              keys.onsuccess = function () {
                var all = keys.result.map(String);
                if (all.indexOf(dir + "/PlayerPrefs") >= 0) return finish();
                var old = all.filter(function (k) { return /^\/idbfs\/[0-9a-f]{32}\/PlayerPrefs$/.test(k); });
                if (old.length === 0) return finish();
                var best = null, left = old.length;
                old.forEach(function (k) {
                  var get = store.get(k);
                  get.onsuccess = function () {
                    var e = get.result;
                    if (e && e.contents && (!best || +new Date(e.timestamp) > +new Date(best.entry.timestamp))) best = { key: k, entry: e };
                    if (--left > 0) return;
                    if (!best) return finish();
                    var from = best.key.slice(0, best.key.lastIndexOf("/"));
                    var parent = store.get(from);
                    parent.onsuccess = function () {
                      store.put(parent.result || { timestamp: new Date(), mode: 16877 }, dir);
                      store.put(best.entry, dir + "/PlayerPrefs");
                      finish("carried over from an older build (" + from + ")");
                    };
                  };
                });
              };
              keys.onerror = function () { finish(); };
            };
          } catch (e) {
            finish();
          }
        });
      }

      lnRescueSaves().then(function () { document.body.appendChild(script); });
    </script>
  </body>
</html>
