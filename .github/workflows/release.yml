# One-click release: Actions -> Cut release -> Run workflow.
#
#   -> tools/ln.py bump <part>: next version (patch by default: 0.3.1 -> 0.3.2) with the PRs merged since the
#      last tag as its notes, on top of CHANGELOG.md
#   -> commit + push that to main
#   -> run Web release (web.yml) on it: build, itch.io, tag + GitHub release
#
# web.yml is started here instead of by the push: pushes made with GITHUB_TOKEN don't trigger other workflows.
# Hand-written notes still work the old way: put the entry in CHANGELOG.md yourself and merge it.
name: Cut release

on:
  workflow_dispatch:
    inputs:
      part:
        description: "Which number to bump"
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency:
  group: cut-release
  cancel-in-progress: false

permissions:
  contents: write # push the CHANGELOG.md commit
  actions: write # start web.yml

jobs:
  cut:
    name: Cut ${{ inputs.part }} release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0 # tags + history, for the notes

      - id: bump
        run: |
          version="$(python3 tools/ln.py bump "${{ inputs.part }}")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          {
            echo "### Cutting $version"
            echo
            python3 tools/ln.py version --notes
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "release: $VERSION"
          git push origin HEAD:main

      # The dispatch resolves `main` on GitHub's side, and right after a push it can still see the old tip (0.3.2's
      # first run built 0.3.1 that way). So wait until main is the release commit, then check the run started on it,
      # and if not cancel it and dispatch again.
      - name: Start Web release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          sha="$(git rev-parse HEAD)"
          for _ in $(seq 1 30); do
            [ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" -q .sha)" = "$sha" ] && break
            sleep 2
          done
          for _ in 1 2 3; do
            url="$(gh workflow run web.yml --ref main -f deploy=true | grep -o 'https://[^ ]*/actions/runs/[0-9]*' || true)"
            id="${url##*/}"
            if [ -z "$id" ]; then echo "::warning::no run id from gh workflow run; not checking its commit"; exit 0; fi
            head="$(gh run view "$id" --json headSha -q .headSha)"
            if [ "$head" = "$sha" ]; then echo "Web release $VERSION: $url"; exit 0; fi
            echo "::warning::Web release run $id started on ${head:0:7}, not the release commit ${sha:0:7}; cancelling and retrying"
            gh run cancel "$id" || true
            sleep 5
          done
          echo "::error::Web release kept starting on the wrong commit; run it by hand (Actions -> Web release, deploy ticked)"
          exit 1
